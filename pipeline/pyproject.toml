[project]
name = "earthrise-ref"
version = "0.1.0"
description = "Reference model for Earthrise: Sun and Earth visibility from the lunar surface, from SPICE and LOLA."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=2", "spiceypy>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["earthrise_ref"]

[tool.pytest.ini_options]
markers = ["network: needs internet (JPL Horizons)", "data: needs the LOLA files in EARTHRISE_DATA"]
testpaths = ["tests"]
